---
name: pr

on:
  pull_request

permissions:
  contents: read

jobs:
  check:
    permissions:
      security-events: write
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0

  build:
    env:
      DOCKER_REGISTRY: "ttl.sh"
    outputs:
      package: ${{ steps.setup.outputs.package }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: buildpacks/github-actions/setup-tools@c1c71086a0e89a65c04ea113390227fd7f05d9df # v6.0.0
      - uses: buildpacks/github-actions/setup-pack@c1c71086a0e89a65c04ea113390227fd7f05d9df # v6.0.0
      - id: setup
        shell: bash
        run: |
          DOCKER_REPO=$(uuidgen)
          PACKAGE="${{ env.DOCKER_REGISTRY }}/${DOCKER_REPO}:20m"
          echo "package=${PACKAGE}" >> $GITHUB_OUTPUT
          echo "Generated name: ${PACKAGE}" >> $GITHUB_STEP_SUMMARY
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: build --snapshot --clean
      - run: make prep
      - run: |
          pack buildpack package \
            --publish \
            ${PACKAGE} \
            --target linux/amd64 \
            --target linux/arm64 \
            --config package.toml
        working-directory: build
        env:
          PACKAGE: ${{ steps.setup.outputs.package }}

  smoke:
    needs: [build]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # jammy-base (amd64 only) — regression safety net
          - test: deno
            builder: paketobuildpacks/builder-jammy-base:latest
            runner: ubuntu-latest
            continue: false
          - test: not-deno
            builder: paketobuildpacks/builder-jammy-base:latest
            runner: ubuntu-latest
            continue: true
          - test: deno2-serve
            builder: paketobuildpacks/builder-jammy-base:latest
            runner: ubuntu-latest
            continue: false
          # ubuntu-noble (amd64 + arm64)
          - test: deno
            builder: paketobuildpacks/ubuntu-noble-builder:latest
            runner: ubuntu-latest
            continue: false
          - test: deno
            builder: paketobuildpacks/ubuntu-noble-builder:latest
            runner: ubuntu-24.04-arm
            continue: false
          - test: not-deno
            builder: paketobuildpacks/ubuntu-noble-builder:latest
            runner: ubuntu-latest
            continue: true
          - test: not-deno
            builder: paketobuildpacks/ubuntu-noble-builder:latest
            runner: ubuntu-24.04-arm
            continue: true
          - test: deno2-serve
            builder: paketobuildpacks/ubuntu-noble-builder:latest
            runner: ubuntu-latest
            continue: false
          - test: deno2-serve
            builder: paketobuildpacks/ubuntu-noble-builder:latest
            runner: ubuntu-24.04-arm
            continue: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: buildpacks/github-actions/setup-tools@c1c71086a0e89a65c04ea113390227fd7f05d9df # v6.0.0
      - uses: buildpacks/github-actions/setup-pack@c1c71086a0e89a65c04ea113390227fd7f05d9df # v6.0.0
      - run: docker pull ${PACKAGE}
        env:
          PACKAGE: ${{ needs.build.outputs.package }}
      - run: docker image ls
      - run: |
          make setup \
            builder=${{ matrix.builder }}
      - continue-on-error: ${{ matrix.continue }}
        run: |
          make smoke-${{ matrix.test }} \
            builder=${{ matrix.builder }} \
            buildpack=${PACKAGE}
        env:
          PACKAGE: ${{ needs.build.outputs.package }}
