---
name: pr

on:
  pull_request

permissions:
  contents: read

jobs:
  check:
    permissions:
      security-events: write
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7

  build:
    env:
      DOCKER_REGISTRY: "ttl.sh"
    outputs:
      package: ${{ steps.setup.outputs.package }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: buildpacks/github-actions/setup-tools@e3b14c6e906f91da358e01dc2849ce068188107f # v5.12.5
      - uses: buildpacks/github-actions/setup-pack@e3b14c6e906f91da358e01dc2849ce068188107f # v5.12.5
      - id: setup
        shell: bash
        run: |
          DOCKER_REPO=$(uuidgen)
          PACKAGE="${{ env.DOCKER_REGISTRY }}/${DOCKER_REPO}:20m"
          echo "package=${PACKAGE}" >> $GITHUB_OUTPUT
          echo "Generated name: ${PACKAGE}" >> $GITHUB_STEP_SUMMARY
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: build --snapshot --clean
      - run: make prep
      - run: |
          pack buildpack package \
            --publish \
            ${PACKAGE} \
            --target linux/amd64 \
            --target linux/arm64 \
            --config package.toml
        working-directory: build
        env:
          PACKAGE: ${{ steps.setup.outputs.package }}

  smoke:
    needs: [build]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # jammy-base (amd64 only) — regression safety net
          - test: deno
            builder: paketobuildpacks/builder-jammy-base:latest
            runner: ubuntu-latest
            continue: false
          - test: not-deno
            builder: paketobuildpacks/builder-jammy-base:latest
            runner: ubuntu-latest
            continue: true
          - test: deno2-serve
            builder: paketobuildpacks/builder-jammy-base:latest
            runner: ubuntu-latest
            continue: false
          # ubuntu-noble (amd64 + arm64)
          - test: deno
            builder: paketobuildpacks/ubuntu-noble-builder:latest
            runner: ubuntu-latest
            continue: false
          - test: deno
            builder: paketobuildpacks/ubuntu-noble-builder:latest
            runner: ubuntu-24.04-arm
            continue: false
          - test: not-deno
            builder: paketobuildpacks/ubuntu-noble-builder:latest
            runner: ubuntu-latest
            continue: true
          - test: not-deno
            builder: paketobuildpacks/ubuntu-noble-builder:latest
            runner: ubuntu-24.04-arm
            continue: true
          - test: deno2-serve
            builder: paketobuildpacks/ubuntu-noble-builder:latest
            runner: ubuntu-latest
            continue: false
          - test: deno2-serve
            builder: paketobuildpacks/ubuntu-noble-builder:latest
            runner: ubuntu-24.04-arm
            continue: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: buildpacks/github-actions/setup-tools@e3b14c6e906f91da358e01dc2849ce068188107f # v5.12.5
      - uses: buildpacks/github-actions/setup-pack@e3b14c6e906f91da358e01dc2849ce068188107f # v5.12.5
      - run: docker pull ${PACKAGE}
        env:
          PACKAGE: ${{ needs.build.outputs.package }}
      - run: docker image ls
      - run: |
          make setup \
            builder=${{ matrix.builder }}
      - continue-on-error: ${{ matrix.continue }}
        run: |
          make smoke-${{ matrix.test }} \
            builder=${{ matrix.builder }} \
            buildpack=${PACKAGE}
        env:
          PACKAGE: ${{ needs.build.outputs.package }}
